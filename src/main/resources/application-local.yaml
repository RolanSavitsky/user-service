spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET:123456789123456789123456789123456789}

internal:
  api-key: ${INTERNAL_API_KEY:internal-key}